name: Build

on:
  push:
    branches: [main, gui, gpu]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    name: Build (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S code -B code/Build

      - name: Build
        run: cmake --build code/Build --config Release

      - name: Smoke test (CLI)
        shell: bash
        run: ./code/Build/Release/pcr-cornell.exe -d 2 -s 4 -S 2

      - name: Stage flat artifacts
        shell: bash
        run: |
          mkdir -p stage
          cp code/Build/Release/pcr-cornell.exe stage/
          cp code/Build/Release/frank-based-rendering.exe stage/
          cp code/Build/Release/physically-cringe-rendering.exe stage/

      - uses: actions/upload-artifact@v4
        with:
          name: pcr-windows-x64
          path: stage/
          if-no-files-found: error
          retention-days: 90

  linux:
    name: Build (Linux x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GLFW build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libgl1-mesa-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev pkg-config

      - name: Configure
        run: cmake -S code -B code/Build

      - name: Build
        run: cmake --build code/Build -j

      - name: Smoke test (CLI)
        run: ./code/Build/pcr-cornell -d 2 -s 4 -S 2

      - name: Stage flat artifacts
        run: |
          mkdir -p stage
          cp code/Build/pcr-cornell stage/
          cp code/Build/frank-based-rendering stage/
          cp code/Build/physically-cringe-rendering stage/

      - uses: actions/upload-artifact@v4
        with:
          name: pcr-linux-x64
          path: stage/
          if-no-files-found: error
          retention-days: 90

  macos:
    name: Build (macOS arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S code -B code/Build

      - name: Build
        run: cmake --build code/Build -j

      - name: Smoke test (CLI)
        run: ./code/Build/pcr-cornell -d 2 -s 4 -S 2

      - name: Stage flat artifacts
        run: |
          mkdir -p stage
          cp code/Build/pcr-cornell stage/
          cp code/Build/frank-based-rendering stage/
          cp code/Build/physically-cringe-rendering stage/

      - uses: actions/upload-artifact@v4
        with:
          name: pcr-macos-arm64
          path: stage/
          if-no-files-found: error
          retention-days: 90

  release:
    name: Publish GitHub Release
    needs: [windows, linux, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - name: Rename and stage individual binaries for release
        run: |
          mkdir -p release

          # Windows .exe binaries
          cp pcr-windows-x64/pcr-cornell.exe                  release/pcr-cornell-windows-x64.exe
          cp pcr-windows-x64/frank-based-rendering.exe        release/frank-based-rendering-windows-x64.exe
          cp pcr-windows-x64/physically-cringe-rendering.exe  release/physically-cringe-rendering-windows-x64.exe

          # Linux binaries
          cp pcr-linux-x64/pcr-cornell                        release/pcr-cornell-linux-x64
          cp pcr-linux-x64/frank-based-rendering              release/frank-based-rendering-linux-x64
          cp pcr-linux-x64/physically-cringe-rendering        release/physically-cringe-rendering-linux-x64

          # macOS binaries
          cp pcr-macos-arm64/pcr-cornell                      release/pcr-cornell-macos-arm64
          cp pcr-macos-arm64/frank-based-rendering            release/frank-based-rendering-macos-arm64
          cp pcr-macos-arm64/physically-cringe-rendering      release/physically-cringe-rendering-macos-arm64

          # download-artifact strips the executable bit on Unix.
          chmod +x release/pcr-cornell-linux-x64 \
                   release/frank-based-rendering-linux-x64 \
                   release/physically-cringe-rendering-linux-x64 \
                   release/pcr-cornell-macos-arm64 \
                   release/frank-based-rendering-macos-arm64 \
                   release/physically-cringe-rendering-macos-arm64

          ls -la release/

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
