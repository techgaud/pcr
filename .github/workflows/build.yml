name: Build

on:
  push:
    branches: [main, gui, gpu, dev]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    name: Build (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S code -B code/Build

      - name: Build
        run: cmake --build code/Build --config Release

      - name: Smoke test (CLI)
        shell: bash
        run: ./code/Build/Release/frank-based-rendering-cli.exe -d 2 -s 4 -S 2

      - name: Stage flat artifacts
        shell: bash
        run: |
          mkdir -p stage
          cp code/Build/Release/frank-based-rendering-cli.exe stage/
          cp code/Build/Release/frank-based-rendering.exe stage/
          cp code/Build/Release/physically-cringe-rendering.exe stage/
          # OIDN runtime DLLs deploy into Release/lib/ next to the .exes
          # (CMake post-build, matches Linux/macOS layout). DllSearch.h
          # adds lib/ to the Windows loader path at startup.
          [ -d code/Build/Release/lib ] && cp -r code/Build/Release/lib stage/ || true
          # Scenes/ rides along so each binary in the artifact zip resolves
          # JSON scenes via the executable-dir fallback out of the box.
          cp -r Scenes stage/
          cp -r models stage/

      - uses: actions/upload-artifact@v4
        with:
          name: pcr-windows-x64
          path: stage/
          if-no-files-found: error
          retention-days: 90

  windows-portable:
    name: Build (Windows x64 portable GPU)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ISPC
        shell: pwsh
        run: |
          $url = "https://github.com/ispc/ispc/releases/download/v1.23.0/ispc-v1.23.0-windows.zip"
          Invoke-WebRequest -Uri $url -OutFile ispc.zip
          Expand-Archive ispc.zip -DestinationPath C:\ispc-install
          # Add the bin/ to PATH for subsequent steps.
          $bin = (Get-ChildItem -Path C:\ispc-install -Recurse -Filter ispc.exe | Select-Object -First 1).DirectoryName
          echo "ISPC bin dir: $bin"
          echo "$bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Configure (static OIDN, GPU only)
        run: cmake -S code -B code/Build-Portable -DPCR_OIDN_STATIC=ON

      - name: Build (physically-cringe-rendering only)
        run: cmake --build code/Build-Portable --config Release --target physically-cringe-rendering

      - name: Stage portable artifact
        shell: bash
        run: |
          mkdir -p stage-portable
          # Single-file binary. No lib/, since OIDN, TBB, and the C
          # runtime are all statically linked into this one .exe.
          cp code/Build-Portable/Release/physically-cringe-rendering.exe \
             stage-portable/physically-cringe-rendering.exe
          cp -r Scenes stage-portable/
          cp -r models stage-portable/

      - name: Verify portable artifact (file-based)
        shell: bash
        run: |
          cd stage-portable
          # No DLLs allowed at the top level. If something copied
          # OpenImageDenoise.dll or tbb12.dll alongside the .exe,
          # static linking didn't take and the artifact is lying
          # about being portable.
          DLLS=$(find . -maxdepth 1 -name "*.dll" 2>/dev/null || true)
          if [ -n "$DLLS" ]; then
            echo "ERROR: portable artifact contains DLLs at top level:"
            echo "$DLLS"
            exit 1
          fi
          # Sanity-check binary size. OIDN's pretrained weights blob
          # is ~50 MB; if the static link worked, the .exe should be
          # at least 30 MB. A normal-sized .exe (~5 MB) means OIDN
          # isn't statically linked even though the link succeeded
          # (probably picked up a header-only stub).
          SIZE=$(stat -c %s physically-cringe-rendering.exe)
          echo "physically-cringe-rendering.exe size: $((SIZE / 1024 / 1024)) MB"
          if [ "$SIZE" -lt 30000000 ]; then
            echo "ERROR: portable binary is suspiciously small. OIDN weights blob"
            echo "is ~50 MB; static linking should produce a 50-80 MB binary."
            exit 1
          fi

      - name: Verify portable artifact (import table)
        shell: pwsh
        run: |
          # Locate dumpbin via vswhere (ships with the VS Installer
          # on every windows-latest runner). Avoids third-party
          # actions for what is ultimately a one-line DLL inspection.
          $vswhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -property installationPath
          $msvcRoot = "$vsPath\VC\Tools\MSVC"
          $msvcVer = (Get-ChildItem -Path $msvcRoot | Sort-Object Name -Descending | Select-Object -First 1).Name
          $dumpbin = "$msvcRoot\$msvcVer\bin\Hostx64\x64\dumpbin.exe"
          if (-not (Test-Path $dumpbin)) {
            Write-Error "dumpbin not found at $dumpbin"
            exit 1
          }
          $exe = "stage-portable\physically-cringe-rendering.exe"
          $imports = & $dumpbin /dependents $exe | Out-String
          Write-Host $imports
          # Forbidden imports for a 'portable' build: anything that
          # would require a sibling DLL on the user's machine. System
          # DLLs (kernel32, user32, opengl32, etc.) are fine. The C
          # runtime should be /MT-static (no msvcp140/vcruntime140).
          $forbidden = @(
            'OpenImageDenoise', 'oidn',
            'tbb12', 'tbbbind', 'tbb\.dll',
            'MSVCP\d', 'VCRUNTIME\d', 'CONCRT\d',
            'pi_level_zero', 'sycl'
          )
          $hits = @()
          foreach ($pat in $forbidden) {
            $matches = [regex]::Matches($imports, "(?i)\b\w*$pat\w*\.dll")
            foreach ($m in $matches) { $hits += $m.Value }
          }
          $hits = $hits | Sort-Object -Unique
          if ($hits.Count -gt 0) {
            Write-Error "Portable binary has forbidden DLL imports: $($hits -join ', ')"
            exit 1
          }
          Write-Host "OK: import table contains only system DLLs"

      - uses: actions/upload-artifact@v4
        with:
          name: pcr-windows-x64-portable
          path: stage-portable/
          if-no-files-found: error
          retention-days: 90

  linux:
    name: Build (Linux x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GLFW build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libgl1-mesa-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev pkg-config

      - name: Configure
        run: cmake -S code -B code/Build

      - name: Build
        run: cmake --build code/Build -j

      - name: Smoke test (CLI)
        run: ./code/Build/frank-based-rendering-cli -d 2 -s 4 -S 2

      - name: Stage flat artifacts
        run: |
          mkdir -p stage
          cp code/Build/frank-based-rendering-cli stage/
          cp code/Build/frank-based-rendering stage/
          cp code/Build/physically-cringe-rendering stage/
          # OIDN libs live in code/Build/lib (matches OIDN's $ORIGIN/../lib).
          [ -d code/Build/lib ] && cp -r code/Build/lib stage/ || true
          cp -r Scenes stage/
          cp -r models stage/

      - uses: actions/upload-artifact@v4
        with:
          name: pcr-linux-x64
          path: stage/
          if-no-files-found: error
          retention-days: 90

  macos:
    name: Build (macOS arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S code -B code/Build

      - name: Build
        run: cmake --build code/Build -j

      - name: Smoke test (CLI)
        run: ./code/Build/frank-based-rendering-cli -d 2 -s 4 -S 2

      # macOS skips physically-cringe-rendering (OpenGL 4.1 cap; needs Metal).
      - name: Stage flat artifacts
        run: |
          mkdir -p stage
          cp code/Build/frank-based-rendering-cli stage/
          cp code/Build/frank-based-rendering stage/
          [ -d code/Build/lib ] && cp -r code/Build/lib stage/ || true
          cp -r Scenes stage/
          cp -r models stage/

      - uses: actions/upload-artifact@v4
        with:
          name: pcr-macos-arm64
          path: stage/
          if-no-files-found: error
          retention-days: 90

  release:
    name: Publish GitHub Release
    needs: [windows, windows-portable, linux, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - name: Rename and stage release assets
        env:
          VER: ${{ github.ref_name }}
        run: |
          mkdir -p release

          # CPU CLI (3 OSes)
          cp pcr-windows-x64/frank-based-rendering-cli.exe \
             "release/frank-based-rendering-cli-${VER}-windows-x64.exe"
          cp pcr-linux-x64/frank-based-rendering-cli \
             "release/frank-based-rendering-cli-${VER}-linux-x64"
          cp pcr-macos-arm64/frank-based-rendering-cli \
             "release/frank-based-rendering-cli-${VER}-macos-arm64"

          # CPU GUI (3 OSes)
          cp pcr-windows-x64/frank-based-rendering.exe \
             "release/frank-based-rendering-${VER}-windows-x64.exe"
          cp pcr-linux-x64/frank-based-rendering \
             "release/frank-based-rendering-${VER}-linux-x64"
          cp pcr-macos-arm64/frank-based-rendering \
             "release/frank-based-rendering-${VER}-macos-arm64"

          # GPU GUI (Windows + Linux only)
          cp pcr-windows-x64/physically-cringe-rendering.exe \
             "release/physically-cringe-rendering-${VER}-windows-x64.exe"
          cp pcr-linux-x64/physically-cringe-rendering \
             "release/physically-cringe-rendering-${VER}-linux-x64"

          # GPU GUI portable (Windows only): single-file .exe with OIDN
          # statically linked. ~50 MB heavier than the bundled variant
          # but no lib/ folder needed; double-click and run.
          cp pcr-windows-x64-portable/physically-cringe-rendering.exe \
             "release/physically-cringe-rendering-${VER}-portable-windows-x64.exe"

          # download-artifact strips +x on Unix; restore.
          chmod +x release/frank-based-rendering-cli-${VER}-linux-x64 \
                   release/frank-based-rendering-cli-${VER}-macos-arm64 \
                   release/frank-based-rendering-${VER}-linux-x64 \
                   release/frank-based-rendering-${VER}-macos-arm64 \
                   release/physically-cringe-rendering-${VER}-linux-x64

          # JSON scenes are OS-agnostic. Ship them as a single archive so
          # users grabbing standalone binaries can drop a matching Scenes/
          # next to their downloaded binary. The hardcoded cornell fallback
          # still works without this archive, but JSON-only scenes (and the
          # version-bumped cornell.json) need it.
          (cd pcr-linux-x64 && zip -r "../release/pcr-scenes-${VER}.zip" Scenes)

          # Models (OBJ/MTL) are OS-agnostic too; ship them as a separate
          # archive so users grabbing the cornell-bunny scene have the bunny
          # mesh available without pulling the full source tree.
          (cd pcr-linux-x64 && zip -r "../release/pcr-models-${VER}.zip" models)

          ls -la release/

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
