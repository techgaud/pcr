name: Build

on:
  push:
    branches: [main, gui, gpu, dev, mac, spectral, test-suite]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # spectral-only: GPU binary, Windows, single zipped artifact. The
  # other branches' build matrix (CPU binaries, Linux, macOS, the
  # release job) is wasted work for the spectral spike, so on the
  # spectral branch we run just this one job and skip the rest.
  windows-spectral-gpu:
    if: github.ref_name == 'spectral'
    name: Build (Windows x64, spectral GPU only, clang-cl)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # clang-cl instead of cl.exe. The MSVC compiler (19.44 on the
      # current windows-latest runner) crashes with an internal C++
      # exception in CL!CloseTypeServerPDB during the "Generating
      # Code..." pass on the spectral codebase, regardless of which
      # workaround we throw at it (IPO off, /Zi stripped, /bigobj,
      # /MP, moving heavy code into .cpp). It's a compiler bug we
      # can't fix from outside cl.exe. clang-cl is MSVC-ABI-
      # compatible (uses the same headers, runtime, linker, and
      # produces equivalent COFF objects), accepts the same
      # command-line flags, and doesn't share the buggy code path.
      # -T ClangCL switches the VS generator's toolset.
      - name: Configure (clang-cl toolset)
        run: cmake -S code -B code/Build -T ClangCL

      - name: Build (GPU only)
        run: cmake --build code/Build --config Release --target physically-cringe-rendering

      - name: Stage GPU bundle
        shell: bash
        run: |
          mkdir -p stage-gpu/physically-cringe-rendering
          cp code/Build/Release/physically-cringe-rendering.exe \
             stage-gpu/physically-cringe-rendering/
          [ -d code/Build/Release/lib ] && cp -r code/Build/Release/lib stage-gpu/physically-cringe-rendering/ || true
          cp -r Scenes stage-gpu/physically-cringe-rendering/
          cp -r models stage-gpu/physically-cringe-rendering/
          cp -r spd    stage-gpu/physically-cringe-rendering/
          [ -d luts ] && cp -r luts stage-gpu/physically-cringe-rendering/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: physically-cringe-rendering-windows-x64
          path: stage-gpu/
          if-no-files-found: error
          retention-days: 90

  windows:
    if: github.ref_name != 'spectral'
    name: Build (Windows x64, clang-cl)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # clang-cl instead of cl.exe. The MSVC compiler crashes in
      # CL!CloseTypeServerPDB during "Generating Code..." on the
      # spectral codebase regardless of the workarounds in
      # code/CMakeLists.txt (IPO off, /Zi stripped, /bigobj). The
      # spectral branch's CI proved clang-cl handles the same source
      # cleanly; this `windows` job uses the same toolset for the
      # full binary matrix (CPU CLI + CPU GUI + GPU GUI) so the
      # spectral->main merge inherits a Windows build that already
      # works with the spectral source.
      #
      # clang-cl is MSVC-ABI-compatible: same headers, runtime, linker,
      # equivalent COFF objects. -T ClangCL switches the VS generator's
      # toolset.
      - name: Configure (clang-cl toolset)
        run: cmake -S code -B code/Build -T ClangCL

      - name: Build
        run: cmake --build code/Build --config Release

      - name: Smoke test (CLI)
        shell: bash
        run: ./code/Build/Release/frank-based-rendering-cli.exe -d 2 -s 4 -S 2

      - name: Stage flat artifacts
        shell: bash
        run: |
          mkdir -p stage
          cp code/Build/Release/frank-based-rendering-cli.exe stage/
          cp code/Build/Release/frank-based-rendering.exe stage/
          cp code/Build/Release/physically-cringe-rendering.exe stage/
          cp code/Build/Release/physically-cringe-rendering-cli.exe stage/
          # OIDN runtime DLLs deploy into Release/lib/ next to the .exes
          # (CMake post-build, matches Linux/macOS layout). DllSearch.h
          # adds lib/ to the Windows loader path at startup.
          [ -d code/Build/Release/lib ] && cp -r code/Build/Release/lib stage/ || true
          # Scenes/ rides along so each binary in the artifact zip resolves
          # JSON scenes via the executable-dir fallback out of the box.
          cp -r Scenes stage/
          cp -r models stage/
          cp -r spd    stage/
          [ -d luts ] && cp -r luts stage/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: pcr-windows-x64
          path: stage/
          if-no-files-found: error
          retention-days: 90

      # Standalone GPU bundle: just physically-cringe-rendering.exe
      # and the files it needs to run (lib/ for OIDN, Scenes/ for
      # the JSON registry, models/ for the bunny mesh). Single
      # downloadable zip named after the binary so the test cycle
      # is "click artifact, extract, double-click .exe."
      - name: Stage GPU bundle
        shell: bash
        run: |
          mkdir -p stage-gpu/physically-cringe-rendering
          cp code/Build/Release/physically-cringe-rendering.exe \
             stage-gpu/physically-cringe-rendering/
          [ -d code/Build/Release/lib ] && cp -r code/Build/Release/lib stage-gpu/physically-cringe-rendering/ || true
          cp -r Scenes stage-gpu/physically-cringe-rendering/
          cp -r models stage-gpu/physically-cringe-rendering/
          cp -r spd    stage-gpu/physically-cringe-rendering/
          [ -d luts ] && cp -r luts stage-gpu/physically-cringe-rendering/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: physically-cringe-rendering-windows-x64
          path: stage-gpu/
          if-no-files-found: error
          retention-days: 90

  linux:
    if: github.ref_name != 'spectral'
    name: Build (Linux x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GLFW build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libgl1-mesa-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev pkg-config

      - name: Configure
        run: cmake -S code -B code/Build

      - name: Build
        run: cmake --build code/Build -j

      - name: Smoke test (CLI)
        run: ./code/Build/frank-based-rendering-cli -d 2 -s 4 -S 2

      - name: Stage flat artifacts
        run: |
          mkdir -p stage
          cp code/Build/frank-based-rendering-cli stage/
          cp code/Build/frank-based-rendering stage/
          cp code/Build/physically-cringe-rendering stage/
          cp code/Build/physically-cringe-rendering-cli stage/
          # OIDN libs live in code/Build/lib (matches OIDN's $ORIGIN/../lib).
          [ -d code/Build/lib ] && cp -r code/Build/lib stage/ || true
          cp -r Scenes stage/
          cp -r models stage/
          cp -r spd    stage/
          [ -d luts ] && cp -r luts stage/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: pcr-linux-x64
          path: stage/
          if-no-files-found: error
          retention-days: 90

  macos:
    if: github.ref_name != 'spectral'
    name: Build (macOS arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S code -B code/Build

      - name: Build
        run: cmake --build code/Build -j

      - name: Smoke test (CLI)
        run: ./code/Build/frank-based-rendering-cli -d 2 -s 4 -S 2

      # GPU render-diff suite. Drives physically-cringe-rendering-cli
      # through the 17-tuple matrix in tests/render-gpu/run.sh and
      # tolerance-diffs against goldens committed under
      # tests/render-gpu/golden/. Goldens are baked locally on the
      # owner's M1 Ultra; this step runs against macos-latest's
      # virtualized M-series GPU. Tolerance is set (--abs-tol 2,
      # --pct-budget 0.05) to absorb atomic-CAS reduction ordering
      # drift between the bake machine and the runner.
      #
      # First-bake-pending guard: if tests/render-gpu/golden/ contains
      # no PNGs, run.sh exits 0 with a "no goldens, skipping" notice
      # rather than failing the job. That keeps this scaffolding
      # commit green until the owner bakes and commits goldens.
      - name: Install Pillow (PIL) for GPU render-diff
        run: python3 -m pip install --user Pillow

      - name: Run GPU render-diff tests
        run: tests/render-gpu/run.sh

      # Surface produced PNGs on failure so the developer can pull them
      # down and eyeball next to the goldens. Output dir is gitignored.
      - name: Upload GPU render output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: render-gpu-output
          path: tests/render-gpu/output/
          if-no-files-found: warn
          retention-days: 14

      # All three binaries now build on macOS: physically-cringe-rendering
      # uses the Metal backend (Gpu/Metal/MetalRenderer.mm) selected by
      # CMake on Apple platforms.
      - name: Stage flat artifacts
        run: |
          mkdir -p stage
          cp code/Build/frank-based-rendering-cli stage/
          cp code/Build/frank-based-rendering stage/
          cp code/Build/physically-cringe-rendering stage/
          cp code/Build/physically-cringe-rendering-cli stage/
          [ -d code/Build/lib ] && cp -r code/Build/lib stage/ || true
          cp -r Scenes stage/
          cp -r models stage/
          cp -r spd    stage/
          [ -d luts ] && cp -r luts stage/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: pcr-macos-arm64
          path: stage/
          if-no-files-found: error
          retention-days: 90

      # Standalone GPU bundle for macOS, mirroring the Windows + Linux
      # GPU-only artifacts.
      - name: Stage GPU bundle
        run: |
          mkdir -p stage-gpu/physically-cringe-rendering
          cp code/Build/physically-cringe-rendering \
             stage-gpu/physically-cringe-rendering/
          [ -d code/Build/lib ] && cp -r code/Build/lib stage-gpu/physically-cringe-rendering/ || true
          cp -r Scenes stage-gpu/physically-cringe-rendering/
          cp -r models stage-gpu/physically-cringe-rendering/
          cp -r spd    stage-gpu/physically-cringe-rendering/
          [ -d luts ] && cp -r luts stage-gpu/physically-cringe-rendering/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: physically-cringe-rendering-macos-arm64
          path: stage-gpu/
          if-no-files-found: error
          retention-days: 90

  # Test job: unit (ctest) + render-diff. Linux only because:
  #   - render goldens are tied to GCC/libstdc++ FP rounding (cross-OS
  #     bit-exact reproduction not expected; per-OS goldens would double
  #     maintenance for marginal coverage gain - see project_pcr_tests
  #     memory and the Q3 decision in the test-suite branch).
  #   - Linux runner is the cheapest GHA host.
  # GPU paths can't be tested headlessly; the manual visual-pass step
  # in the pre-merge checklist covers them.
  #
  # Runs on every triggering branch including spectral, since the test
  # suite landed on spectral and we want every spectral push to run it.
  tests:
    name: Tests (unit + render diff, Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GLFW build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libgl1-mesa-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev pkg-config

      - name: Install Pillow (PIL) for render-diff
        run: python3 -m pip install --user Pillow

      # OIDN OFF: tests don't exercise --oidn (deliberately omitted from
      # the render matrix because the neural denoiser is non-deterministic
      # across hardware), so skip the OIDN download to keep the job lean.
      - name: Configure (PCR_BUILD_TESTS=ON, OIDN OFF)
        run: cmake -S code -B code/Build -DPCR_BUILD_TESTS=ON -DPCR_USE_OIDN=OFF

      - name: Build CLI + tests
        run: |
          cmake --build code/Build -j \
            --target frank-based-rendering-cli \
                     test_colorspace \
                     test_rgbtospec \
                     test_spectrum \
                     test_bvh \
                     test_optics

      - name: Run unit tests (ctest)
        run: ctest --test-dir code/Build --output-on-failure

      - name: Run render-diff tests
        run: tests/render/run.sh

      # Surface the produced PNGs when the diff fails so a developer
      # can pull them down and eyeball next to the goldens. tests/render/
      # output/ is gitignored so it only exists in the runner workspace.
      - name: Upload render output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: render-test-output
          path: tests/render/output/
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [windows, linux, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - name: Rename and stage release assets
        env:
          VER: ${{ github.ref_name }}
        run: |
          mkdir -p release

          # CPU CLI (3 OSes)
          cp pcr-windows-x64/frank-based-rendering-cli.exe \
             "release/frank-based-rendering-cli-${VER}-windows-x64.exe"
          cp pcr-linux-x64/frank-based-rendering-cli \
             "release/frank-based-rendering-cli-${VER}-linux-x64"
          cp pcr-macos-arm64/frank-based-rendering-cli \
             "release/frank-based-rendering-cli-${VER}-macos-arm64"

          # CPU GUI (3 OSes)
          cp pcr-windows-x64/frank-based-rendering.exe \
             "release/frank-based-rendering-${VER}-windows-x64.exe"
          cp pcr-linux-x64/frank-based-rendering \
             "release/frank-based-rendering-${VER}-linux-x64"
          cp pcr-macos-arm64/frank-based-rendering \
             "release/frank-based-rendering-${VER}-macos-arm64"

          # GPU GUI (all 3 OSes; macOS uses Metal backend, Win/Linux OpenGL)
          cp pcr-windows-x64/physically-cringe-rendering.exe \
             "release/physically-cringe-rendering-${VER}-windows-x64.exe"
          cp pcr-linux-x64/physically-cringe-rendering \
             "release/physically-cringe-rendering-${VER}-linux-x64"
          cp pcr-macos-arm64/physically-cringe-rendering \
             "release/physically-cringe-rendering-${VER}-macos-arm64"

          # GPU CLI (all 3 OSes; same Metal/OpenGL backend selection as GPU GUI)
          cp pcr-windows-x64/physically-cringe-rendering-cli.exe \
             "release/physically-cringe-rendering-cli-${VER}-windows-x64.exe"
          cp pcr-linux-x64/physically-cringe-rendering-cli \
             "release/physically-cringe-rendering-cli-${VER}-linux-x64"
          cp pcr-macos-arm64/physically-cringe-rendering-cli \
             "release/physically-cringe-rendering-cli-${VER}-macos-arm64"

          # download-artifact strips +x on Unix; restore.
          chmod +x release/frank-based-rendering-cli-${VER}-linux-x64 \
                   release/frank-based-rendering-cli-${VER}-macos-arm64 \
                   release/frank-based-rendering-${VER}-linux-x64 \
                   release/frank-based-rendering-${VER}-macos-arm64 \
                   release/physically-cringe-rendering-${VER}-linux-x64 \
                   release/physically-cringe-rendering-${VER}-macos-arm64 \
                   release/physically-cringe-rendering-cli-${VER}-linux-x64 \
                   release/physically-cringe-rendering-cli-${VER}-macos-arm64

          # JSON scenes are OS-agnostic. Ship them as a single archive so
          # users grabbing standalone binaries can drop a matching Scenes/
          # next to their downloaded binary. The hardcoded cornell fallback
          # still works without this archive, but JSON-only scenes (and the
          # version-bumped cornell.json) need it.
          (cd pcr-linux-x64 && zip -r "../release/pcr-scenes-${VER}.zip" Scenes)

          # Models (OBJ/MTL) are OS-agnostic too; ship them as a separate
          # archive so users grabbing the cornell-bunny scene have the bunny
          # mesh available without pulling the full source tree.
          (cd pcr-linux-x64 && zip -r "../release/pcr-models-${VER}.zip" models)

          # Spectral data (.spd) and precomputed LUTs are also OS-agnostic.
          # cornell-spec references measured Cornell SPDs from spd/cornell/;
          # luts/ contains the default-kres16 Jakob LUT shipped pre-built.
          # Both directories need to ride along next to the binary, so ship
          # them as separate archives matching the Scenes/ and models/ pattern.
          (cd pcr-linux-x64 && zip -r "../release/pcr-spd-${VER}.zip" spd)
          [ -d pcr-linux-x64/luts ] && (cd pcr-linux-x64 && zip -r "../release/pcr-luts-${VER}.zip" luts) || true

          # Bundled per-OS archives. The granular files above let users
          # grab just the CLI on Linux or just the GPU binary on Windows
          # without pulling everything; these bundles are for users who
          # just want a single download containing binaries + Scenes/ +
          # models/ + spd/ + luts/ for their platform. Each per-OS staging
          # dir already has the right shape from the build job, so we just
          # zip it up.
          (cd pcr-windows-x64 && zip -r "../release/pcr-${VER}-windows-x64.zip" .)
          (cd pcr-linux-x64   && zip -r "../release/pcr-${VER}-linux-x64.zip"   .)
          (cd pcr-macos-arm64 && zip -r "../release/pcr-${VER}-macos-arm64.zip" .)

          ls -la release/

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Highlights

            Wavefront kernel architecture for the Metal backend on
            Apple Silicon, with full spectral mode inside the wavefront
            pipeline. The default backend is now wavefront (was
            megakernel through v1.4.0), beating megakernel by ~25% on
            cornell-class workloads at 1080² Picture.

            Glass dispersion in spectral mode now defaults to
            per-wavelength forking. Four monochromatic sub-paths cover
            the hero wavelengths at the first dispersive refraction,
            each refracting at its own Cauchy IOR. The cheaper
            terminate-secondaries strategy stays available via
            `--spectral-terminate` or the GUI's Glass radio.

            Mac infrastructure work queued since v1.4.0 also lands:
            adaptive multi-pass kernel (`useAdaptive=ON` now takes the
            saturation-friendly path instead of the ~6x slower strip
            path), spatial chopping for 16K renders, a new
            `physically-cringe-rendering-cli` headless GPU binary, OIDN
            device-buffer fix so denoising actually runs on every Mac
            OIDN render, and `cmake --install` for typeable-from-$PATH
            install.

            Three new scenes: `closed-cornell-glass`,
            `closed-cornell-spec` (Cornell box with a fourth wall
            behind the camera, eliminates dark camera-facing patches
            in specular reflections), `bright-cornell-glass` (entire
            ceiling promoted to the area light).

            ## Install

            Download the **bundled per-OS zip** for your platform. It
            contains the binary plus `Scenes/`, `models/`, `spd/`,
            `luts/`, and `lib/` (OIDN runtime), all pre-arranged. The
            binary needs those folders next to it at startup.

            - **Windows:** `pcr-${{ github.ref_name }}-windows-x64.zip` →
              extract → double-click `physically-cringe-rendering.exe`
              (GPU GUI), `frank-based-rendering.exe` (CPU GUI), or run
              `frank-based-rendering-cli.exe` /
              `physically-cringe-rendering-cli.exe` from a terminal.
              SmartScreen warns the first time. Click *More info* →
              *Run anyway*.
            - **macOS (Apple Silicon):**
              `pcr-${{ github.ref_name }}-macos-arm64.zip` → extract →
              from a terminal in the extracted folder, run
              `xattr -dr com.apple.quarantine .` to clear the Gatekeeper
              quarantine flag, then double-click
              `physically-cringe-rendering` (Metal-backed GPU GUI) or
              run `./frank-based-rendering-cli` /
              `./physically-cringe-rendering-cli` from terminal.
            - **Linux:** `pcr-${{ github.ref_name }}-linux-x64.zip` →
              extract → `chmod +x` if needed → `./physically-cringe-rendering`
              (GPU GUI) or `./physically-cringe-rendering-cli`
              (headless GPU). GPU paths need OpenGL 4.3.

            ### Standalone binary downloads

            Individual binaries are also published (no bundled folders).
            They're useful when you already have the data folders from a
            previous version and just want to swap the executable. For
            first-time install, prefer the bundled zip above.

            ## Verify a render

            Each PNG carries embedded tEXt metadata (Software, Backend,
            Scene, all render parameters, render time, Architecture,
            WavefrontMode, WavefrontDispersion, Spectral, HeroSamples).
            Read it with `exiftool yourimage.png` (or any tool that
            handles PNG tEXt chunks) to confirm provenance after the
            fact.

            ## Changes
